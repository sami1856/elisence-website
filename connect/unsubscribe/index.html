<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unsubscribe from ELISENCE Updates</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="stylesheet" href="/assets/connect-consent/connect-consent.css" />
</head>
<body class="ecc-page">
  <main class="ecc-page-card" aria-live="polite">
    <h1 id="pageTitle">Processing unsubscribe…</h1>
    <p id="pageCopy">Please wait while we update your preferences.</p>
    <a class="ecc-home-link" href="https://elisence.com/">Return to ELISENCE</a>
  </main>
  <script>
    (function () {
      var API_BASE = "https://api.elisence.com";
      var titleEl = document.getElementById("pageTitle");
      var copyEl = document.getElementById("pageCopy");

      function showSuccess() {
        titleEl.textContent = "You are unsubscribed";
        copyEl.textContent =
          "You will no longer receive ELISENCE Connect email updates. We respect your choice and remain committed to building a governed digital health ecosystem with truth, clarity and human-centred design at its core.";
      }

      function showFailure() {
        titleEl.textContent = "Link unavailable";
        copyEl.textContent =
          "This unsubscribe link is invalid or has expired. To stop receiving updates, email contact@elisence.com from the address you subscribed with.";
      }

      var token = "";
      try {
        token = String(new URLSearchParams(window.location.search).get("token") || "").trim();
      } catch (err) {
        token = "";
      }

      if (!token) {
        showFailure();
        return;
      }

      fetch(API_BASE + "/v8/connect/unsubscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ token: token }),
        credentials: "omit",
        cache: "no-store"
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            return { status: res.status, data: data };
          });
        })
        .then(function (result) {
          if (result.status >= 200 && result.status < 300) {
            showSuccess();
            return;
          }
          showFailure();
        })
        .catch(function () {
          showFailure();
        });
    })();
  </script>
</body>
</html>
