  <style>
    :root {
      --desktop-nav-space: 270px;
      --desktop-page-gap: 26px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {
      background: #000000;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #ffffff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          ellipse at 38% 0%,
          rgba(4, 30, 60, 0.5) 0%,
          rgba(2, 8, 18, 0.42) 38%,
          rgba(0, 0, 0, 1) 82%
        ),
        #000000;
    }

    /*
      MAIN HOMEPAGE AREA

      The complete image occupies the full available width
      between the left edge and the fixed navigation.
    */

main {
  position: relative;
  width: calc(100vw - var(--desktop-nav-space));
  min-height: 100vh;

  /* پنل بالاتر می‌رود */
  padding:
    4px
    0
    80px
    var(--desktop-page-gap);
}

.homepage-hero {
    position: relative;
    overflow: visible;
}

/* Blue ambient glow */
.homepage-hero::before{
    content:"";
    position:absolute;
    inset:-18px;
    z-index:-2;
    pointer-events:none;

    border-radius:42px;

    background:
        radial-gradient(circle at 50% 0%,
            rgba(0,210,255,.22) 0%,
            rgba(0,150,255,.12) 35%,
            transparent 70%),

        radial-gradient(circle at 50% 100%,
            rgba(0,180,255,.34) 0%,
            rgba(0,120,255,.18) 40%,
            transparent 75%),

        radial-gradient(circle at 0% 50%,
            rgba(0,170,255,.18) 0%,
            transparent 70%),

        radial-gradient(circle at 100% 50%,
            rgba(0,170,255,.18) 0%,
            transparent 70%);

    filter:blur(34px);
    opacity:.95;
}

.homepage-hero::after {
  content: "";
  position: absolute;
  z-index: -1;

  left: 12%;
  right: 12%;
  bottom: -11px;

  height: 34px;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(120, 235, 255, 0.82) 0%,
      rgba(0, 170, 255, 0.46) 42%,
      transparent 78%
    );

  filter: blur(13px);
  opacity: 0.9;
}

    /*
      FIXED RIGHT-SIDE NAVIGATION
    */

    .side-nav {
      position: fixed;

      right: 30px;
      top: 50%;
      transform: translateY(-50%);

      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;

      width: 205px;
      max-height: calc(100vh - 30px);

      overflow-y: auto;
      overflow-x: visible;

      padding: 12px 5px;

      z-index: 999;
      scrollbar-width: none;
    }

    .side-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 42px;
      padding: 11px 22px;

      border-radius: 999px;

      text-decoration: none;
      text-align: center;
      white-space: nowrap;

      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      color: #e9f7ff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 145, 255, 0.42),
          rgba(0, 24, 60, 0.92) 55%,
          rgba(0, 7, 22, 0.98) 100%
        );

      border: 1px solid rgba(90, 190, 255, 0.82);

      box-shadow:
        inset 0 0 13px rgba(65, 170, 255, 0.18),
        0 0 13px rgba(0, 140, 255, 0.72),
        0 0 28px rgba(0, 55, 160, 0.68);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateX(-5px);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 190, 255, 0.62),
          rgba(0, 42, 100, 0.96) 56%,
          rgba(0, 10, 30, 1) 100%
        );

      box-shadow:
        inset 0 0 16px rgba(90, 210, 255, 0.25),
        0 0 19px rgba(0, 195, 255, 0.95),
        0 0 40px rgba(0, 90, 220, 0.85);
    }

    .nav-btn:active {
      transform: translateX(-2px) scale(0.985);
    }

    .nav-btn:focus-visible {
      outline: 2px solid #b9efff;
      outline-offset: 4px;
    }

    /*
      MEDIUM DESKTOP / TABLET LANDSCAPE
    */

    @media (max-width: 1200px) {
      :root {
        --desktop-nav-space: 225px;
        --desktop-page-gap: 18px;
      }

      .side-nav {
        right: 14px;
        width: 180px;
        gap: 8px;
      }

      .nav-btn {
        min-height: 38px;
        padding: 9px 16px;
        font-size: 10px;
        letter-spacing: 0.1em;
      }
    }

    /*
      MOBILE AND SMALL TABLETS
    */

    @media (max-width: 900px) {
      body {
        padding-bottom: 235px;
      }

      main {
        width: 100%;
        min-height: auto;
        padding: 12px 12px 60px;
      }

      .homepage-hero {
        width: 100%;
        max-width: none;
      }

      .homepage-hero-image {
        width: 100%;
        height: auto;
      }

      .homepage-hero::after {
        left: 4%;
        right: 4%;
        bottom: -18px;
        height: 48px;
        filter: blur(18px);
      }

      .side-nav {
        position: fixed;

        left: 12px;
        right: 12px;
        top: auto;
        bottom: 12px;

        transform: none;

        width: auto;
        max-height: 205px;

        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-content: flex-start;

        gap: 7px;
        padding: 10px;

        overflow-y: auto;

        border-radius: 22px;

        background: rgba(0, 6, 18, 0.82);
        border: 1px solid rgba(90, 180, 255, 0.22);

        box-shadow:
          0 0 25px rgba(0, 85, 200, 0.34);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .nav-btn {
        width: auto;
        min-height: 34px;
        padding: 8px 14px;

        font-size: 9px;
        letter-spacing: 0.09em;
      }

      .nav-btn:hover {
        transform: none;
      }
    }

    /*
      VERY SMALL MOBILE
    */

    @media (max-width: 480px) {
      main {
        padding: 8px 8px 50px;
      }

      .side-nav {
        left: 7px;
        right: 7px;
        bottom: 7px;
      }

      .nav-btn {
        padding: 7px 11px;
        font-size: 8px;
      }
    }
    @media (max-width: 1200px) {
  .homepage-hero-image {
    height: clamp(260px, 39vw, 420px);
  }
}

@media (max-width: 900px) {
  main {
    padding: 4px 12px 60px;
  }

  .homepage-hero-image {
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  .homepage-hero::before {
    left: 4%;
    right: 4%;
    bottom: -22px;
    height: 54px;
    filter: blur(18px);
  }

  .homepage-hero::after {
    left: 10%;
    right: 10%;
    bottom: -9px;
    height: 28px;
    filter: blur(11px);
  }
}
    /* SAFE AMBIENT GLOW — DOES NOT CHANGE HERO SIZE */

/* HERO SIZE CORRECTION — SIZE ONLY */

.homepage-hero {
  width: calc(100vw - 330px);

}

.homepage-hero-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 430px;
  object-fit: contain;
  object-position: left top;
}
