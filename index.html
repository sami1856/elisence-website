  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #ffffff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #04101f 0%,
          #02040a 45%,
          #000000 100%
        );
    }

    /*
      NEW HOMEPAGE PANEL

      The image is the complete panel.
      No extra card surrounds it.
      It starts at the top of the page.
      Desktop space is reserved for the fixed navigation.
    */

    .homepage-hero {
      position: relative;
      width: calc(100vw - 280px);
      max-width: 1600px;
      margin: 0;
      padding: 0;
      line-height: 0;
      isolation: isolate;
    }

    .homepage-hero-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 330px;
      margin: 0;
      padding: 0;
      object-fit: contain;
      object-position: left top;
      border: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Blue light appears only beneath the panel.
    */

    .homepage-hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 8%;
      right: 8%;
      bottom: -28px;
      height: 68px;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 195, 255, 0.78) 0%,
          rgba(0, 160, 255, 0.38) 40%,
          rgba(0, 105, 255, 0.10) 72%,
          transparent 100%
        );
      filter: blur(22px);
    }

    /*
      EXISTING RIGHT-SIDE NAVIGATION
    */

    .side-nav {
      position: fixed;
      right: 32px;
      top: calc(50% + 58px);
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }

    .nav-btn {
      display: block;
      padding: 13px 38px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e3f2ff;
      background:
        radial-gradient(
          circle at top,
          rgba(0, 130, 255, 0.45),
          rgba(0, 10, 35, 0.97)
        );
      border: 1px solid rgba(90, 185, 255, 0.9);
      box-shadow:
        0 0 16px rgba(0, 130, 255, 0.95),
        0 0 34px rgba(0, 40, 120, 0.95);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        padding 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateX(-4px);
      padding-right: 44px;
      box-shadow:
        0 0 22px rgba(0, 190, 255, 1),
        0 0 46px rgba(0, 80, 200, 1);
      background:
        radial-gradient(
          circle at top,
          rgba(0, 170, 255, 0.7),
          rgba(0, 25, 80, 1)
        );
    }

    .nav-btn:active {
      transform: translateX(-2px) scale(0.99);
    }

    /*
      TABLET
    */

    @media (max-width: 1100px) {
      .homepage-hero {
        width: calc(100vw - 235px);
      }

      .homepage-hero-image {
        max-height: 295px;
      }

      .side-nav {
        right: 20px;
      }

      .nav-btn {
        padding: 11px 26px;
        font-size: 12px;
      }
    }

    /*
      MOBILE
    */

    @media (max-width: 900px) {
      body {
        padding-bottom: 230px;
      }

      .homepage-hero {
        width: 100%;
      }

      .homepage-hero-image {
        width: 100%;
        max-height: none;
        object-position: center top;
      }

      .homepage-hero::after {
        left: 5%;
        right: 5%;
        bottom: -18px;
        height: 48px;
      }

      .side-nav {
        position: fixed;
        right: 50%;
        top: auto;
        bottom: 18px;
        transform: translateX(50%);
        width: calc(100% - 24px);
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .nav-btn {
        padding: 9px 20px;
        font-size: 11px;
        letter-spacing: 0.11em;
      }

      .nav-btn:hover {
        transform: none;
        padding-right: 20px;
      }
    }
  </style>
</head>
