<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Audit | ELISENCE Passport</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/passport/assets/passport.css" />
</head>
<body data-pp-page="audit">
  <a class="pp-skip" href="#pp-main">Skip to content</a>
  <main id="pp-main" class="pp-main" data-pp-main>
    <div class="pp-topbar">
      <div>
        <p class="pp-kicker">Audit</p>
        <h1 class="pp-title">Governance events</h1>
        <p class="pp-subtitle">Sanitized ERCP audit trail. Tokens and secrets are never displayed.</p>
      </div>
      <div class="pp-demo-banner">Connecting to ERCP…</div>
    </div>

    <section class="pp-card">
      <div class="pp-table-wrap">
        <table class="pp-table" aria-label="Audit events">
          <thead>
            <tr>
              <th>When</th>
              <th>What</th>
              <th>Who</th>
              <th>Campaign</th>
              <th>Audience</th>
              <th>Previous</th>
              <th>New</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="pp-empty" id="empty" hidden>No audit events in the local ERCP dataset.</p>
    </section>
  </main>

  <script src="/passport/assets/config.js"></script>
  <script src="/passport/assets/operations-api.js"></script>
  <script src="/passport/assets/operations-adapters.js"></script>
  <script src="/passport/assets/passport.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var ui = window.ElisencePassportUI;
      var api = window.ElisenceOperationsApi;
      ui.showLoading("Loading audit from ERCP…");
      api.getAudit({ page: 1, page_size: 100 }).then(function (body) {
        ui.clearStatus();
        ui.setLiveBanner("Live ERCP read · production");
        var items = body.items || [];
        var empty = document.getElementById("empty");
        empty.hidden = items.length > 0;
        document.getElementById("rows").innerHTML = items.map(function (e) {
          var payload = e.payload || {};
          return (
            "<tr>" +
            "<td>" + ui.escapeHtml(e.when) + "</td>" +
            "<td><strong>" + ui.escapeHtml(e.what) + "</strong></td>" +
            "<td>" + ui.escapeHtml(e.result || "—") + "</td>" +
            "<td>" + ui.escapeHtml(payload.campaign_id || "—") + "</td>" +
            "<td>" + ui.escapeHtml(e.relationship_id || "—") + "</td>" +
            "<td>" + ui.escapeHtml(payload.from || payload.previous || "—") + "</td>" +
            "<td>" + ui.escapeHtml(payload.to || payload.next || payload.status || "—") + "</td>" +
            "<td>" + ui.escapeHtml(payload.note || payload.error || "—") + "</td>" +
            "</tr>"
          );
        }).join("");
      }).catch(function (err) {
        document.getElementById("rows").innerHTML = "";
        ui.showOpsFailure(err);
      });
    });
  </script>
</body>
</html>
