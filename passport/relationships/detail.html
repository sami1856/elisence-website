<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Relationship detail | ELISENCE Passport</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/passport/assets/passport.css" />
</head>
<body data-pp-page="relationships">
  <a class="pp-skip" href="#pp-main">Skip to content</a>
  <main id="pp-main" class="pp-main" data-pp-main>
    <div id="detail-root"></div>
  </main>

  <script src="/passport/assets/config.js"></script>
  <script src="/passport/assets/operations-api.js"></script>
  <script src="/passport/assets/operations-adapters.js"></script>
  <script src="/passport/assets/passport.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var ui = window.ElisencePassportUI;
      var api = window.ElisenceOperationsApi;
      var adapt = window.ElisenceOperationsAdapters;
      var root = document.getElementById("detail-root");
      var id = ui.qs("id");

      function notFound(msg) {
        document.title = "Relationship not found | ELISENCE Passport";
        root.innerHTML =
          '<div class="pp-topbar">' +
          "<div>" +
          '<nav class="pp-breadcrumb" aria-label="Breadcrumb">' +
          '<a href="/passport/relationships/">Relationships</a>' +
          '<span class="pp-breadcrumb__sep" aria-hidden="true">→</span>' +
          "<span>Not found</span>" +
          "</nav>" +
          '<p class="pp-kicker">Relationship detail</p>' +
          '<h1 class="pp-title">Relationship not found</h1>' +
          '<p class="pp-subtitle">' + ui.escapeHtml(msg || "No relationship matches this identifier.") + "</p>" +
          "</div>" +
          '<div class="pp-demo-banner">Live ERCP read · production</div>' +
          "</div>" +
          '<section class="pp-card pp-empty-state" aria-live="polite">' +
          '<p class="pp-empty-state__lead">This detail view expects a canonical relationship_id.</p>' +
          '<a class="pp-btn pp-btn--ghost" href="/passport/relationships/">← Back to Relationships</a>' +
          "</section>";
      }

      if (!id) {
        notFound("Missing relationship_id query parameter.");
        return;
      }

      root.innerHTML = '<div class="pp-card"><p class="pp-card__meta">Loading relationship from ERCP…</p></div>';
      api.getRelationship(id).then(function (body) {
        var r = adapt.mapDetail(body);
        var tl = r.timeline || [];
        document.title = r.name + " | ELISENCE Passport";
        root.innerHTML =
          '<div class="pp-topbar">' +
          "<div>" +
          '<nav class="pp-breadcrumb" aria-label="Breadcrumb">' +
          '<a href="/passport/relationships/">Relationships</a>' +
          '<span class="pp-breadcrumb__sep" aria-hidden="true">→</span>' +
          "<span>" + ui.escapeHtml(r.name) + "</span>" +
          "</nav>" +
          '<p class="pp-kicker">Relationship detail</p>' +
          '<h1 class="pp-title">' + ui.escapeHtml(r.name) + "</h1>" +
          '<p class="pp-subtitle">' + ui.escapeHtml(r.role) + " — " + ui.escapeHtml(r.organisation) + "</p>" +
          "</div>" +
          "<div>" +
          '<div class="pp-demo-banner" style="margin-bottom:10px">Live ERCP read · production</div>' +
          '<a class="pp-btn pp-btn--ghost" href="/passport/relationships/">← Back to Relationships</a>' +
          "</div>" +
          "</div>" +
          '<section class="pp-grid pp-grid--3" aria-label="Identity summary">' +
          '<article class="pp-card"><p class="pp-card__label">Status</p><div>' + ui.statusChip(r.status) + "</div></article>" +
          '<article class="pp-card"><p class="pp-card__label">Source</p><p class="pp-card__meta pp-card__meta--strong">' + ui.escapeHtml(r.source) + "</p></article>" +
          '<article class="pp-card"><p class="pp-card__label">Meeting context</p><p class="pp-card__meta pp-card__meta--strong">' + ui.escapeHtml(r.met) + "</p></article>" +
          "</section>" +
          '<section class="pp-grid pp-grid--2">' +
          '<article class="pp-card">' +
          '<h2 class="pp-card__title">Consent &amp; engagement</h2>' +
          '<div class="pp-stat-row"><span>Consent state</span><strong>' + ui.escapeHtml(r.status) + "</strong></div>" +
          '<div class="pp-stat-row"><span>Consent confirmed</span><strong>' + ui.escapeHtml(r.consentConfirmed) + "</strong></div>" +
          '<div class="pp-stat-row"><span>Last communication</span><strong>' + ui.escapeHtml(r.lastCommunication) + "</strong></div>" +
          '<div class="pp-stat-row"><span>Engagement summary</span><strong>' + ui.escapeHtml(r.engagement) + "</strong></div>" +
          '<div style="margin-top:14px" class="pp-tags">' +
          r.interests.map(function (i) {
            return '<span class="pp-chip">' + ui.escapeHtml(i) + "</span>";
          }).join("") +
          "</div></article>" +
          '<article class="pp-card pp-card--green">' +
          '<h2 class="pp-card__title">Relationship actions</h2>' +
          '<p class="pp-card__meta" style="margin-bottom:14px">Actions are UI placeholders. No live send or ledger mutation occurs.</p>' +
          '<button type="button" class="pp-btn pp-btn--green" disabled>Prepare update (demo)</button>' +
          "</article>" +
          "</section>" +
          '<section class="pp-card" style="margin-top:16px" aria-label="Relationship history">' +
          '<h2 class="pp-card__title">Relationship history</h2>' +
          (tl.length
            ? '<div class="pp-timeline">' +
              tl.map(function (item) {
                return (
                  '<div class="pp-timeline__item">' +
                  '<div class="pp-timeline__date">' + ui.escapeHtml(item.date) + "</div>" +
                  '<div class="pp-timeline__title">' + ui.escapeHtml(item.title) + "</div>" +
                  '<div class="pp-timeline__meta">' + ui.escapeHtml(item.meta) + "</div>" +
                  "</div>"
                );
              }).join("") +
              "</div>"
            : '<p class="pp-empty">No timeline events for this relationship.</p>') +
          "</section>";
      }).catch(function (err) {
        if (err && err.status === 404) {
          notFound("No ERCP relationship matches this relationship_id.");
          return;
        }
        var unauthorized = err && (err.status === 401 || err.status === 403);
        root.innerHTML =
          '<div class="pp-topbar"><div><h1 class="pp-title">' +
          (unauthorized ? "Not authorized" : "Operations API unavailable") +
          "</h1>" +
          '<p class="pp-subtitle">' + ui.escapeHtml((err && err.message) || "error") + "</p></div>" +
          '<div class="pp-demo-banner">' +
          (unauthorized ? "Not authorized · no mock fallback" : "ERCP read failed · no mock fallback") +
          "</div></div>" +
          '<section class="pp-card"><a class="pp-btn pp-btn--ghost" href="/passport/relationships/">← Back to Relationships</a></section>';
      });
    });
  </script>
</body>
</html>
